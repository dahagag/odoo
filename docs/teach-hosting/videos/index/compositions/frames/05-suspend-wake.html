      <div class="sw05-icon-card" id="sw05-icon-card">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var iconCard = "#sw05-icon-card";
      var iconBars = "#sw05-bar-1, #sw05-bar-2, #sw05-bar-3";
      var statusDot = "#sw05-status-dot";
      var glow = "#sw05-glow";
      var labelActive = "#sw05-label-active";
      var labelSuspended = "#sw05-label-suspended";
      var btn = "#sw05-btn";
      var cursor = "#sw05-cursor";
      var ripples = "#sw05-ripple-1, #sw05-ripple-2";

      var ACTIVE_COLOR = "#714b67";
      var DIM_COLOR = "#9a9a9a";
      var ACTIVE_DOT = "#059669";
      var DIM_DOT = "#9a9a9a";

      // ---- Scene 1 (0.0-4.0s): presence, icon settles glowing "Active" ----
      tl.fromTo(
        iconCard,
        { opacity: 0, scale: 0.85 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" },
        0
      );
      tl.fromTo(
        labelActive,
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" },
        0.05
      );
      tl.fromTo(
        glow,
        { opacity: 0, scale: 0.85 },
        { opacity: 0.32, scale: 1, duration: 0.5, ease: "power2.out" },
        0
      );

      // resting-hero aliveness — bounded rotation/scale breath, phase-driven
      (function () {
        var iconCardEl = document.querySelector(iconCard);
        var phase = { p: 0 };
        tl.to(
          phase,
          {
            p: Math.PI * 2 * 1.5,
            duration: 3.4,
            ease: "none",
            onUpdate: function () {
              var s = Math.sin(phase.p);
              iconCardEl.style.transform =
                "translateY(" + (s * 2).toFixed(2) + "px) scale(" + (1 + s * 0.01).toFixed(4) + ")";
            },
          },
          0.6
        );
      })();

      // ---- Scene 2 (4.0-7.2s): dim to "Suspended" (state-swap, power3) ----
      tl.to(
        iconBars,
        { stroke: DIM_COLOR, duration: 0.5, ease: "power3.inOut" },
        4.0
      );
      tl.to(
        statusDot,
        { fill: DIM_DOT, duration: 0.5, ease: "power3.inOut" },
        4.0
      );
      tl.to(
        iconCard,
        { borderColor: "rgba(154,154,154,0.2)", duration: 0.5, ease: "power3.inOut" },
        4.0
      );
      tl.to(
        glow,
        { opacity: 0.08, duration: 0.5, ease: "power3.inOut" },
        4.0
      );
      tl.to(
        labelActive,
        { opacity: 0, duration: 0.45, ease: "power3.inOut" },
        4.0
      );
      tl.to(
        labelSuspended,
        { opacity: 1, duration: 0.45, ease: "power3.inOut" },
        4.0
      );

      // ---- Scene 3 (7.2-11.2s): Wake Up button, click relights the icon ----
      tl.fromTo(
        btn,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        7.2
      );

      // cursor approach — arrives from off-stage, decelerating, lands a few px
      // off the button's geometric center (human-aimed, not dead-center)
      gsap.set(cursor, { x: 2080, y: 900 });
      tl.to(
        cursor,
        { x: 1054, y: 828, duration: 0.8, ease: "power3.out" },
        7.8
      );

      // physics-press-reaction: coordinated press-down on cursor + button
      tl.to(
        [btn, cursor],
        { scale: 0.9, duration: 0.15, ease: "power1.in" },
        8.6
      );
      tl.to(
        btn,
        { boxShadow: "inset 0 0 18px rgba(113,75,103,0.55)", duration: 0.15, ease: "power1.in" },
        8.6
      );

      // release — spring back together
      tl.to(
        [btn, cursor],
        { scale: 1, duration: 0.45, ease: "back.out(1.8)" },
        8.75
      );
      tl.to(
        btn,
        { boxShadow: "0 0 24px rgba(113,75,103,0.35)", duration: 0.45, ease: "power2.out" },
        8.75
      );

      // cursor-click-ripple: rings expand and fade from the click point
      tl.set(ripples, { opacity: 1 }, 8.65);
      tl.fromTo(
        ripples,
        { scale: 0, opacity: 1 },
        {
          scale: 4,
          opacity: 0,
          duration: 0.55,
          ease: "power2.out",
          stagger: 0.08,
        },
        8.65
      );

      // press is what relights the icon — same causality as the CTA click
      tl.to(
        iconBars,
        { stroke: ACTIVE_COLOR, duration: 0.4, ease: "power3.out" },
        8.6
      );
      tl.to(
        statusDot,
        { fill: ACTIVE_DOT, duration: 0.4, ease: "power3.out" },
        8.6
      );
      tl.to(
        iconCard,
        { borderColor: "rgba(113,75,103,0.2)", duration: 0.4, ease: "power3.out" },
        8.6
      );
      tl.to(
        labelSuspended,
        { opacity: 0, duration: 0.45, ease: "power3.out" },
        8.6
      );
      tl.to(
        labelActive,
        { opacity: 1, duration: 0.45, ease: "power3.out" },
        8.6
      );

      // ambient-glow-bloom — glow re-blooms, landing as the icon settles at 9.2s
      tl.fromTo(
        glow,
        { opacity: 0.08, scale: 0.95 },
        { opacity: 0.4, scale: 1, duration: 0.4, ease: "power2.out" },
        8.8
      );

      // final settle (9.2-11.2s) — bounded, out-of-phase breathe on icon + glow,
      // fully still for the last 0.2s before the frame ends
      (function () {
        var iconCardEl = document.querySelector(iconCard);
        var glowEl = document.querySelector(glow);
        var phase = { p: 0 };
        tl.to(
          phase,
          {
            p: Math.PI * 2,
            duration: 1.7,
            ease: "none",
            onUpdate: function () {
              var s = Math.sin(phase.p);
              var g = Math.sin(phase.p + Math.PI / 2);
              iconCardEl.style.transform =
                "translateY(" + (s * 2).toFixed(2) + "px) scale(" + (1 + s * 0.01).toFixed(4) + ")";
              glowEl.style.opacity = (0.4 + g * 0.03).toFixed(3);
            },
          },
          9.3
        );
      })();

      window.__timelines["05-suspend-wake"] = tl;
    })();
  </script>
