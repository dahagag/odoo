    (function () {

      var stagechip = q("#f09-stagechip");
      var stageline = q("#f09-stageline");
      var chips = Array.prototype.slice.call(root.querySelectorAll(".f09-chip"));
      var beats = Array.prototype.slice.call(root.querySelectorAll("#f09-line > span"));
      var words = Array.prototype.slice.call(root.querySelectorAll(".f09-word"));

      /* ══ CAMERA — viewport-change, single-wrapper composite transform ══
         ONE .world, ONE cam object, ONE writer. Layout is font-metric independent
         (explicit line-heights + explicit card heights), so the measured offset is
         deterministic. T = -offset x S is the single-wrapper counter-translate
         (NOT the nested-wrapper T = -offset).                                     */
      var S0 = 5.6;   /* open: the amber card full-bleed (5.6 x 199.8px = 1119 > 1080) */
      var S1 = 4.78;  /* dwell floor: 14.6% travel — under the 15% cap */
      var DWELL_BIAS_Y = -26; /* world rides up a touch so the card BELOW peeks in,
                                 while the column head above stays out of frame */

      /* Measured ONCE, synchronously at build time — never from inside a callback.
         The renderer seeks with suppressEvents=false and a cold render worker seeks
         in non-linear order, so a measurement reachable from onUpdate would be
         seek-order dependent and could poison the camera pose for the whole render.
         The board is mounted and sized before this script runs, so this read is the
         real laid-out geometry; everything downstream derives from this constant. */
      var OFF = (function measureOffsetOnce() {
        var x = 0, y = 0, n = ours;
        while (n && n !== world) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
        var W = world.offsetWidth, H = world.offsetHeight;
        return {
          x: x + ours.offsetWidth / 2 - W / 2,
          y: y + ours.offsetHeight / 2 - H / 2
        };
      })();

      var cam = { scale: S0, x: 0, y: 0 };
      function applyCamera() {
        world.style.transform = "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
      }

      var easeDwell = gsap.parseEase("power1.inOut");
      var easeBurst = gsap.parseEase("expo.out");

      var HOLD_END = 1.4;   /* Scene 1 — camera static in close-up */
      var DWELL_END = 3.4;  /* Scene 2 — the gentle outward ease */
      var LOCK_AT = 5.0;    /* Scene 3 — the burst ends; the frame LOCKS */

      /* Poses, all derived from the one build-time measured offset. */
      function pose(t) {
        var o = OFF;
        var p0 = { s: S0, x: -o.x * S0, y: -o.y * S0 };
        var p1 = { s: S1, x: -o.x * S1, y: -o.y * S1 + DWELL_BIAS_Y };
        var p, e;
        if (t <= HOLD_END) return p0;
        if (t < DWELL_END) {
          e = easeDwell((t - HOLD_END) / (DWELL_END - HOLD_END));
          return { s: p0.s + (p1.s - p0.s) * e, x: p0.x + (p1.x - p0.x) * e, y: p0.y + (p1.y - p0.y) * e };
        }
        if (t < LOCK_AT) {
          e = easeBurst((t - DWELL_END) / (LOCK_AT - DWELL_END));
          return { s: p1.s + (1 - p1.s) * e, x: p1.x + (0 - p1.x) * e, y: p1.y + (0 - p1.y) * e };
        }
        return { s: 1, x: 0, y: 0 }; /* wide. locked. */
      }

      function camAt(t) {

        cam.scale = p.s; cam.x = p.x; cam.y = p.y;

            Sparse state array + reverse search each frame; the jump is instant

        { t: 11.0, i: 0 },  /* "It gates two actions." */

        for (var k = 0; k < beats.length; k++) {

        }

          duration: DUR,
          ease: "none",
