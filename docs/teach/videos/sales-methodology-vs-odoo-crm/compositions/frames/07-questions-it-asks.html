  <script>
    (function () {

      var kicker = q("#f07-kicker");
      var activity = q("#f07-activity");
      var checkPath = q("#f07-checkpath");

      tl.fromTo(activity, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.14);

      var checkLen = checkPath.getTotalLength();
      checkPath.style.strokeDasharray = String(checkLen);
      checkPath.style.strokeDashoffset = String(checkLen);

      /* ── Scene 2 (1.2–2.4s) — svg-path-draw: on "done" the teal check draws
            itself into the box; the mono "Marked done" tag flashes in after. ── */
      tl.to(checkPath, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 1.2);
      tl.fromTo(markedDone, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 1.78);

      /* ── Scene 3 (2.4–6.6s) — center-outward-expansion (adapted: origin = the
            activity chip, not stage center) + spring-pop-entrance per card, no
            overshoot. Cards cascade out from behind the chip into the triptych,
            left to right at ~1.2s apart, each question revealing as it lands. ── */
      var chipRect = activity.getBoundingClientRect();
      /* The emergence vector points at the chip but travels only a FRACTION of the
         way there. At full length card 3 flew the width of the frame across cards 1
         and 2, putting question text over question text for ~3s of a 10s frame. A
         short rise out of the chip's direction reads as the same causality and stays
         legible; the timing (each card right after the check) carries the rest. */

      [card1, card2, card3].forEach(function (card, i) {
        var cardRect = card.getBoundingClientRect();
        var dx = ((chipRect.left + chipRect.width / 2) - (cardRect.left + cardRect.width / 2)) * EMERGE;
        var dy = ((chipRect.top + chipRect.height / 2) - (cardRect.top + cardRect.height / 2)) * EMERGE;
        var startAt = 2.4 + i * 1.2;
        tl.fromTo(
          card,
          { x: dx, y: dy, scale: 0.88, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
          startAt
        );
      });

            its four stops arriving left to right; "Marked Won" flips to its
            block-red lit state on the spoken word (hard cut, driver-recomputed
            so it holds correctly under any seek). The other three stops stay
            hairline-only throughout. ── */
      tl.fromTo(railLabel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 6.6);
      [stop1, stopWon, stop3, stop4].forEach(function (stop, i) {
        tl.fromTo(stop, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 6.7 + i * 0.15);
      });

      var LIT_AT = Infinity; /* rail stays unlit — frame 8 owns the Won beat */

          stopWon.style.backgroundColor = "#F3DBDB";
          stopWon.style.borderColor = "#A23B3B";
          stopWon.style.color = "#A23B3B";

          stopWon.style.borderColor = "";
          stopWon.style.color = "";
        }
      }
      applyWonState(0);
      var wonDriver = { t: 0 };
