name: Retag an already-pushed image with a release version
description: >-
  Adds a second tag (the current release version) onto an image ecr_push (or an equivalent
  content-hash-tagged build job) already pushed at PR time — no rebuild, idempotent against a
  re-run or a concurrent retag. Reused (issue #217) by deploy-administration-stack-staging and
  deploy-administration-stack-production so the two don't each carry their own copy of this shell
  block; generalized by `repository_name` (issue #341) so deploy-odoo-staging can reuse the exact
  same logic for the agentic-erp/odoo-staging repository instead of a duplicate copy of this
  action with a different hardcoded repository name.
inputs:
  content_hash_tag:
    description: The content-hash tag the build job published this commit's image under.
    required: true
  release_tag:
    description: The release version tag to add (from resolve-release-tag).
    required: true
  platform_account_id:
    description: The Platform Account ID the ECR repository lives in.
    required: true
  repository_name:
    description: The ECR repository name to retag in.
    required: false
    default: agentic-erp/administration-stack-api
runs:
  using: composite
  steps:
    - name: Retag the PR-built image with the release version
      shell: bash
      env:
        CONTENT_HASH_TAG: ${{ inputs.content_hash_tag }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        PLATFORM_ACCOUNT_ID: ${{ inputs.platform_account_id }}
        REPOSITORY_NAME: ${{ inputs.repository_name }}
      run: |
        manifest=$(aws ecr batch-get-image \
          --registry-id "$PLATFORM_ACCOUNT_ID" \
          --repository-name "$REPOSITORY_NAME" \
          --image-ids imageTag="$CONTENT_HASH_TAG" \
          --query 'images[0].imageManifest' --output text)
        if [[ -z "$manifest" || "$manifest" == "None" ]]; then
          echo "No $REPOSITORY_NAME image found for content-hash tag $CONTENT_HASH_TAG — did the build job run for this commit's relevant tree?" >&2
          exit 1
        fi
        # Idempotent: a re-run for a commit whose release tag was already retagged must not fail
        # the job — neither "the tag already points at this manifest" nor a concurrent retag
        # racing this one (ImageAlreadyExistsException) is a real deploy failure.
        existing=$(aws ecr batch-get-image \
          --registry-id "$PLATFORM_ACCOUNT_ID" \
          --repository-name "$REPOSITORY_NAME" \
          --image-ids imageTag="$RELEASE_TAG" \
          --query 'images[0].imageManifest' --output text 2>/dev/null || true)
        if [[ "$existing" == "$manifest" ]]; then
          echo "Release tag $RELEASE_TAG already points at this manifest — nothing to retag."
          exit 0
        fi
        if ! aws ecr put-image \
          --registry-id "$PLATFORM_ACCOUNT_ID" \
          --repository-name "$REPOSITORY_NAME" \
          --image-tag "$RELEASE_TAG" \
          --image-manifest "$manifest" 2> put-image.err; then
          if grep -q ImageAlreadyExistsException put-image.err; then
            cat put-image.err >&2
            echo "Concurrent retag already created $RELEASE_TAG — treating as success."
          else
            cat put-image.err >&2
            exit 1
          fi
        fi
