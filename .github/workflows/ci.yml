name: CI

on:
  pull_request:
    branches: [dev/19.0, main/19.0]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect lint/test-relevant changes
    runs-on: ubuntu-latest
    outputs:
      image_relevant: ${{ steps.check.outputs.image_relevant }}
      docs_build: ${{ steps.check.outputs.docs_build }}
      test_modules: ${{ steps.plan.outputs.modules }}
    steps:
      # image_relevant and docs_build are deliberately independent: docs_build's
      # docs-build-tests job runs on bare ubuntu-latest and never touches the
      # Odoo dev image, so it shouldn't force build-image/lint/test to run, and
      # vice versa.
      - name: Check for changes affecting the Odoo dev image, lint, or tests
        id: check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image_relevant:
              - 'custom_addons/**'
              - 'docker/**'
              - 'scripts/dev.sh'
              - 'requirements.txt'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'
            docs_build:
              - '.github/workflows/ci.yml'
              - 'scripts/docs_build/**'
              - 'docs/**'
              - 'custom_addons/crm_methodology/static/docs/**/*.html'
      - uses: actions/checkout@v4
      - name: Build per-module change filters
        run: |
          {
            echo "shared:"
            echo "  - 'docker/**'"
            echo "  - 'scripts/dev.sh'"
            echo "  - 'requirements.txt'"
            echo "  - 'compose.yaml'"
            echo "  - '.github/workflows/ci.yml'"
            for manifest in custom_addons/*/__manifest__.py; do
              module="$(basename "$(dirname "$manifest")")"
              echo "module_${module}:"
              echo "  - 'custom_addons/${module}/**'"
            done
          } > "$RUNNER_TEMP/module-filters.yml"
      - name: Detect which modules changed
        id: modules
        uses: dorny/paths-filter@v3
        with:
          filters: "${{ runner.temp }}/module-filters.yml"
      - name: Plan which owned modules need testing
        id: plan
        env:
          SHARED_CHANGED: ${{ steps.modules.outputs.shared }}
          CHANGED_FILTERS: ${{ steps.modules.outputs.changes }}
        run: |
          # A change outside a specific module's own directory (docker/, scripts/, a
          # shared file directly under custom_addons/, the Dockerfile, etc.) can affect
          # every module's test run, so fall back to testing all of them. Only when
          # every changed path falls under a single module's own directory do we narrow
          # the run to just those modules.
          if [[ "$SHARED_CHANGED" == "true" ]]; then
            modules=()
            for manifest in custom_addons/*/__manifest__.py; do
              modules+=("$(basename "$(dirname "$manifest")")")
            done
          else
            mapfile -t matched < <(jq -r '.[]' <<<"$CHANGED_FILTERS")
            modules=()
            for filter in "${matched[@]}"; do
              [[ "$filter" == module_* ]] && modules+=("${filter#module_}")
            done
          fi

          printf '%s\n' "${modules[@]:-}" | jq -R . | jq -sc 'map(select(length > 0))' | { read -r json; echo "modules=$json" >> "$GITHUB_OUTPUT"; }

  build-image:
    name: Build development image
    needs: changes
    if: needs.changes.outputs.image_relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Read defaults shared with local dev (.env.example)
        id: defaults
        run: |
          echo "odoo_image=$(sed -n -E 's/^ODOO_IMAGE=(.*)$/\1/p' .env.example)" >> "$GITHUB_OUTPUT"
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"
      - name: Compute the image tag from its content inputs
        # Tag by the hash of everything that actually affects the image's contents
        # (not github.sha), so a PR that only touches custom_addons/ or scripts/
        # resolves to an already-published tag and skips the push below entirely.
        # hashFiles() only works inside a step's own expression context, not in a
        # job-level env: block, so it's computed here and read via step outputs.
        id: tag
        run: echo "image=ghcr.io/${{ github.repository }}/odoo-dev:${{ hashFiles('docker/odoo-dev.Dockerfile', 'docker/*.sh', 'requirements.txt', '.env.example') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: ./.github/actions/ghcr-login
      - name: Check whether this image tag is already published
        id: existing
        env:
          DEV_IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$DEV_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.exists != 'true'
        with:
          context: .
          file: docker/odoo-dev.Dockerfile
          build-args: |
            ODOO_IMAGE=${{ steps.defaults.outputs.odoo_image }}
            HOST_UID=${{ steps.defaults.outputs.uid }}
            HOST_GID=${{ steps.defaults.outputs.gid }}
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    name: Lint (required)
    needs: [changes, build-image]
    # build-image is skipped (not failed) when nothing relevant changed; without
    # this, GitHub's default skip-propagation would skip this required check
    # entirely instead of letting it no-op via the steps' own `if` guards below.
    # Still require `changes` to have actually succeeded, and don't proceed if
    # build-image genuinely failed (as opposed to being skipped).
    if: ${{ needs.changes.result == 'success' && needs.build-image.result != 'failure' && needs.build-image.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.image_relevant == 'true'
      - name: Configure environment
        if: needs.changes.outputs.image_relevant == 'true'
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> .env
          echo "HOST_GID=$(id -g)" >> .env
          echo "ODOO_DEV_IMAGE=${{ needs.build-image.outputs.image }}" >> .env
      - uses: ./.github/actions/ghcr-login
        if: needs.changes.outputs.image_relevant == 'true'
      - name: Pull cached development image
        if: needs.changes.outputs.image_relevant == 'true'
        run: docker compose pull odoo
      - name: Run ruff
        if: needs.changes.outputs.image_relevant == 'true'
        run: bash scripts/dev.sh lint custom_addons

  docs-build-tests:
    name: Docs-build tooling tests (required)
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_build == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.docs_build == 'true'
        with:
          python-version: '3.x'
      - name: Run docs-build unit tests
        if: needs.changes.outputs.docs_build == 'true'
        run: |
          python3 -m unittest discover -s scripts/docs_build/tests -t .

  test:
    name: Test (${{ matrix.module }})
    needs: [changes, build-image]
    if: needs.changes.outputs.image_relevant == 'true' && needs.changes.outputs.test_modules != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Non-blocking by design: see docs/agents/sdlc.md#continuous-integration.
    # Do not add this job to the branch's required status checks.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.test_modules) }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> .env
          echo "HOST_GID=$(id -g)" >> .env
          echo "ODOO_DEV_IMAGE=${{ needs.build-image.outputs.image }}" >> .env
      - uses: ./.github/actions/ghcr-login
      - name: Pull cached development image
        run: docker compose pull odoo
      - name: Run tests for ${{ matrix.module }}
        run: bash scripts/dev.sh test "${{ matrix.module }}"
