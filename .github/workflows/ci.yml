name: CI

on:
  pull_request:
    branches: [dev/19.0, main/19.0]
  push:
    branches: [dev/19.0]

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel in-progress runs for pull_request: two pushes to a PR branch in
  # quick succession should cancel the stale one. A push straight to dev/19.0
  # never should — github.ref for a push event is the branch itself
  # (refs/heads/dev/19.0), shared by every merge, so cancel-in-progress here
  # would let a fast-following merge cancel a prior merge's publish-image job
  # mid-push, silently dropping that content-hash tag from GHCR (see
  # docs/adr/0030).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect lint/test-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_relevant: ${{ steps.check.outputs.image_relevant }}
      docs_build: ${{ steps.check.outputs.docs_build }}
      infra_relevant: ${{ steps.check.outputs.infra_relevant }}
      lint_relevant: ${{ steps.check.outputs.lint_relevant }}
      test_modules: ${{ steps.plan.outputs.modules }}
    steps:
      # image_relevant, docs_build, infra_relevant, and lint_relevant are deliberately
      # independent of each other: docs-build-tests and infra-checks run on bare
      # ubuntu-latest and never touch the Odoo dev image, and `ruff` (lint_relevant)
      # doesn't need it either (see docs/adr/0028) — none of the three should force
      # build-image/test to run, and a docker/**-only or requirements.txt-only change
      # (image_relevant) shouldn't force lint to run since it can't affect `ruff`'s
      # output.
      - name: Check for changes affecting the Odoo dev image, lint, docs, tests, or infra
        id: check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image_relevant:
              - 'custom_addons/**'
              - 'docker/**'
              - 'scripts/dev.sh'
              - 'requirements.txt'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            docs_build:
              - '.github/workflows/ci.yml'
              - 'scripts/docs_build/**'
              - 'docs/**'
              - 'custom_addons/crm_methodology/static/docs/**/*.html'
            infra_relevant:
              - 'infra/**'
              - '.github/workflows/ci.yml'
            lint_relevant:
              - 'custom_addons/**'
              - 'ruff.toml'
              - 'scripts/dev.sh'
              - 'scripts/dev.ps1'
              - '.github/workflows/ci.yml'
      - uses: actions/checkout@v4
      - name: Build per-module change filters
        run: |
          {
            echo "shared:"
            echo "  - 'docker/**'"
            echo "  - 'scripts/dev.sh'"
            echo "  - 'requirements.txt'"
            echo "  - 'compose.yaml'"
            echo "  - '.github/workflows/ci.yml'"
            echo "  - '.github/actions/**'"
            for manifest in custom_addons/*/__manifest__.py; do
              module="$(basename "$(dirname "$manifest")")"
              echo "module_${module}:"
              echo "  - 'custom_addons/${module}/**'"
            done
          } > "$RUNNER_TEMP/module-filters.yml"
      - name: Detect which modules changed
        id: modules
        uses: dorny/paths-filter@v3
        with:
          filters: "${{ runner.temp }}/module-filters.yml"
      - name: Plan which owned modules need testing
        id: plan
        env:
          SHARED_CHANGED: ${{ steps.modules.outputs.shared }}
          CHANGED_FILTERS: ${{ steps.modules.outputs.changes }}
        run: |
          # A change outside a specific module's own directory (docker/, scripts/, a
          # shared file directly under custom_addons/, the Dockerfile, etc.) can affect
          # every module's test run, so fall back to testing all of them. Only when
          # every changed path falls under a single module's own directory do we narrow
          # the run to just those modules.
          if [[ "$SHARED_CHANGED" == "true" ]]; then
            modules=()
            for manifest in custom_addons/*/__manifest__.py; do
              modules+=("$(basename "$(dirname "$manifest")")")
            done
          else
            mapfile -t matched < <(jq -r '.[]' <<<"$CHANGED_FILTERS")
            modules=()
            for filter in "${matched[@]}"; do
              [[ "$filter" == module_* ]] && modules+=("${filter#module_}")
            done
          fi

          printf '%s\n' "${modules[@]:-}" | jq -R . | jq -sc 'map(select(length > 0))' | { read -r json; echo "modules=$json" >> "$GITHUB_OUTPUT"; }

  build-image:
    name: Build development image
    needs: changes
    # PR-time only: this job never publishes, so it never needs packages: write
    # (see docs/adr/0030). The push-side counterpart is publish-image, gated to
    # the trusted push-to-dev/19.0 trigger below.
    if: github.event_name == 'pull_request' && needs.changes.outputs.image_relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.compute.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compute-dev-image-tag
        id: compute
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/odoo-dev.Dockerfile
          build-args: |
            ODOO_IMAGE=${{ steps.compute.outputs.odoo_image }}
            HOST_UID=${{ steps.compute.outputs.uid }}
            HOST_GID=${{ steps.compute.outputs.gid }}
          load: true
          tags: ${{ steps.compute.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save the built image for the test job in this run to consume
        # Never pushed to GHCR from here — this job only builds far enough for
        # test to run against it (see docs/adr/0030). The image only needs to
        # exist locally, handed to the test job via a workflow artifact.
        run: docker save "${{ steps.compute.outputs.image }}" -o /tmp/odoo-dev-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: odoo-dev-image
          path: /tmp/odoo-dev-image.tar
          retention-days: 1

  lint:
    name: Lint
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.lint_relevant == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.lint_relevant == 'true'
        with:
          python-version: '3.x'
      - name: Install ruff
        if: needs.changes.outputs.lint_relevant == 'true'
        run: pip install ruff==0.16.1
      - name: Run ruff
        if: needs.changes.outputs.lint_relevant == 'true'
        # No --ignore EXE002: that exclusion is Windows/MSYS-only local-dev
        # noise (see docs/adr/0028) and doesn't apply on this Linux runner.
        run: ruff check --config ruff.toml custom_addons

  docs-build-tests:
    name: Docs-build tooling tests
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_build == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.docs_build == 'true'
        with:
          python-version: '3.x'
      - name: Run docs-build unit tests
        if: needs.changes.outputs.docs_build == 'true'
        run: |
          python3 -m unittest discover -s scripts/docs_build/tests -t .

  infra-checks:
    name: Infra checks
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.infra_relevant == 'true'
      - uses: opentofu/setup-opentofu@v1
        if: needs.changes.outputs.infra_relevant == 'true'
        with:
          tofu_version: 1.8.5
      - name: tofu fmt -check
        if: needs.changes.outputs.infra_relevant == 'true'
        run: tofu fmt -check -recursive infra/
      - name: tofu validate (bootstrap, foundation, trial_org, and its validate fixture)
        if: needs.changes.outputs.infra_relevant == 'true'
        run: |
          for dir in infra/bootstrap infra/foundation infra/modules/trial_org infra/modules/trial_org/examples/validate; do
            echo "::group::tofu validate $dir"
            (cd "$dir" && tofu init -backend=false -input=false && tofu validate)
            echo "::endgroup::"
          done
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.infra_relevant == 'true'
        with:
          python-version: '3.x'
      - name: Install ruff and interrogate
        if: needs.changes.outputs.infra_relevant == 'true'
        run: pip install ruff==0.16.1 interrogate==1.7.0
      - name: Run ruff
        if: needs.changes.outputs.infra_relevant == 'true'
        run: ruff check --config ruff.toml infra/
      - name: Run interrogate (docstring-coverage regression tripwire, not a documentation-quality proxy — 80% floor matches CodeRabbit's own default)
        if: needs.changes.outputs.infra_relevant == 'true'
        run: interrogate --fail-under 80 infra/

  ci-required:
    name: CI required checks (required)
    needs: [lint, docs-build-tests, infra-checks]
    # if: always() so this still runs (and can fail) even when lint,
    # docs-build-tests, or infra-checks was skipped — e.g. because the
    # upstream `changes` job itself errored. GitHub branch protection treats
    # a skipped required check as passing, so without this a `changes`
    # failure would let a PR merge without any of them ever having run.
    # Restricted to pull_request: it's a merge gate, so it has nothing to
    # require on a post-merge push to dev/19.0, where lint/docs-build-tests/
    # infra-checks are themselves skipped (see their own if: conditions).
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require lint, docs-build-tests, and infra-checks to have succeeded
        if: needs.lint.result != 'success' || needs.docs-build-tests.result != 'success' || needs.infra-checks.result != 'success'
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "docs-build-tests: ${{ needs.docs-build-tests.result }}"
          echo "infra-checks: ${{ needs.infra-checks.result }}"
          exit 1

  test:
    name: Test (${{ matrix.module }})
    needs: [changes, build-image]
    if: github.event_name == 'pull_request' && needs.changes.outputs.image_relevant == 'true' && needs.changes.outputs.test_modules != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Non-blocking by design: see docs/agents/sdlc.md#continuous-integration.
    # Do not add this job to the branch's required status checks.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.test_modules) }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> .env
          echo "HOST_GID=$(id -g)" >> .env
          echo "ODOO_DEV_IMAGE=${{ needs.build-image.outputs.image }}" >> .env
      - uses: actions/download-artifact@v4
        with:
          name: odoo-dev-image
          path: /tmp
      - name: Load the image build-image built for this run (never pulled from GHCR)
        run: docker load -i /tmp/odoo-dev-image.tar
      - name: Run tests for ${{ matrix.module }}
        run: bash scripts/dev.sh test "${{ matrix.module }}"

  publish-image:
    name: Publish development image
    needs: changes
    # Trusted trigger only: this is the one job in the workflow that carries
    # packages: write, and it never runs for a pull_request (see docs/adr/0030).
    if: github.event_name == 'push' && needs.changes.outputs.image_relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compute-dev-image-tag
        id: compute
      - uses: docker/setup-buildx-action@v3
      - uses: ./.github/actions/ghcr-login
      - name: Check whether this image tag is already published
        id: existing
        env:
          DEV_IMAGE: ${{ steps.compute.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$DEV_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.exists != 'true'
        with:
          context: .
          file: docker/odoo-dev.Dockerfile
          build-args: |
            ODOO_IMAGE=${{ steps.compute.outputs.odoo_image }}
            HOST_UID=${{ steps.compute.outputs.uid }}
            HOST_GID=${{ steps.compute.outputs.gid }}
          push: true
          tags: ${{ steps.compute.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
