name: CI

on:
  pull_request:
    branches: [dev/19.0, main/19.0]

jobs:
  changes:
    name: Detect lint/test-relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - name: Check for changes under custom_addons/, docker/, scripts/, etc.
        id: check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'custom_addons/**'
              - 'docker/**'
              - 'scripts/**'
              - 'requirements.txt'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'

  build-image:
    name: Build development image
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DEV_IMAGE: ghcr.io/${{ github.repository }}/odoo-dev:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Read runner UID/GID
        id: host_ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/odoo-dev.Dockerfile
          build-args: |
            ODOO_IMAGE=odoo:19.0-20260817
            HOST_UID=${{ steps.host_ids.outputs.uid }}
            HOST_GID=${{ steps.host_ids.outputs.gid }}
          push: true
          tags: ${{ env.DEV_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    name: Lint (required)
    needs: [changes, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.relevant == 'true'
      - name: Configure environment
        if: needs.changes.outputs.relevant == 'true'
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> .env
          echo "HOST_GID=$(id -g)" >> .env
          echo "ODOO_DEV_IMAGE=ghcr.io/${{ github.repository }}/odoo-dev:${{ github.sha }}" >> .env
      - name: Log in to GHCR
        if: needs.changes.outputs.relevant == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull cached development image
        if: needs.changes.outputs.relevant == 'true'
        run: docker compose pull odoo
      - name: Run ruff
        if: needs.changes.outputs.relevant == 'true'
        run: bash scripts/dev.sh lint custom_addons

  test:
    name: Test (informational)
    needs: [changes, build-image]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Non-blocking by design: see docs/agents/sdlc.md#continuous-integration.
    # Do not add this job to the branch's required status checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> .env
          echo "HOST_GID=$(id -g)" >> .env
          echo "ODOO_DEV_IMAGE=ghcr.io/${{ github.repository }}/odoo-dev:${{ github.sha }}" >> .env
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull cached development image
        run: docker compose pull odoo
      - name: Run tests for every owned module
        run: |
          set -euo pipefail
          for manifest in custom_addons/*/__manifest__.py; do
            module="$(basename "$(dirname "$manifest")")"
            echo "::group::Testing $module"
            bash scripts/dev.sh test "$module"
            echo "::endgroup::"
          done
