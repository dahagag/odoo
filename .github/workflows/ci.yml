name: CI

on:
  pull_request:
    branches: [dev/19.0, main/19.0]
  # Issue #215: a merge to either branch re-runs this workflow so infra-checks gates infra-apply
  # below on the same commit (not just on the PR's merge-ref simulation) — `needs:` can only
  # reference a job in this same workflow run, so infra-apply's gate on infra-checks only works if
  # both trigger from the same `on:` block. The pre-existing pull_request-only jobs (build-image,
  # test, ...) each already guard on `github.event.pull_request...`, which is simply absent on a
  # push event, so they resolve to skipped rather than erroring.
  push:
    branches: [dev/19.0, main/19.0]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a push-triggered run mid-flight: infra-apply below may be applying real
  # infrastructure, and cancelling that partway is exactly the "partial, ambiguous state" issue
  # #215 requires this workflow not to leave behind. Pull-request runs keep the previous
  # superseded-by-a-new-push behavior.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect lint/test-relevant changes
    runs-on: ubuntu-latest
    outputs:
      image_relevant: ${{ steps.check.outputs.image_relevant }}
      prod_image_relevant: ${{ steps.check.outputs.prod_image_relevant }}
      docs_build: ${{ steps.check.outputs.docs_build }}
      infra_relevant: ${{ steps.check.outputs.infra_relevant }}
      infra_cicd_registry_relevant: ${{ steps.check.outputs.infra_cicd_registry_relevant }}
      infra_platform_relevant: ${{ steps.check.outputs.infra_platform_relevant }}
      lint_relevant: ${{ steps.check.outputs.lint_relevant }}
      stack_relevant: ${{ steps.check.outputs.stack_relevant }}
      release_version_relevant: ${{ steps.check.outputs.release_version_relevant }}
      manifest_version_relevant: ${{ steps.check.outputs.manifest_version_relevant }}
      test_modules: ${{ steps.plan.outputs.modules }}
    steps:
      # Issue #215: checked out before the paths-filter step below (not after, as before this
      # change) because this job now also runs on `push` (dorny/paths-filter needs a local
      # checkout to diff against the pre-push SHA on a push event; a pull_request event doesn't
      # need it — that path uses the GitHub REST API instead — but checking out unconditionally
      # earlier is a no-op for that case, not a behavior change).
      - uses: actions/checkout@v4
      # image_relevant, prod_image_relevant, docs_build, infra_relevant, lint_relevant,
      # stack_relevant, release_version_relevant, and manifest_version_relevant are
      # deliberately independent of each other: docs-build-tests, infra-checks,
      # stack-checks, release-version-tests, and manifest-version-check run on bare
      # ubuntu-latest and never touch the Odoo dev image, and `ruff` (lint_relevant)
      # doesn't need it either (see docs/adr/0028) — none of these should force
      # build-image/test to run, and a docker/**-only or requirements.txt-only change
      # (image_relevant) shouldn't force lint, stack-checks, or release-version-tests to
      # run since it can't affect their output.
      - name: Check for changes affecting the Odoo dev image, prod image, lint, docs, tests, infra, the stack, or release-version derivation
        id: check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image_relevant:
              - 'custom_addons/**'
              - 'docker/**'
              - 'scripts/dev.sh'
              - 'requirements.txt'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            prod_image_relevant:
              - '.env.example'
              - 'odoo-bin'
              - 'odoo/**'
              - 'addons/**'
              - 'custom_addons/**'
              - 'docker/odoo-prod.Dockerfile'
              - 'docker/odoo-prod.conf'
              - 'docker/pip-install-requirements.sh'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            docs_build:
              - '.github/workflows/ci.yml'
              - 'scripts/docs_build/**'
              - 'docs/**'
              - 'custom_addons/crm_methodology/static/docs/**/*.html'
            infra_relevant:
              - 'infra/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/infra-tofu/**'
            # Issue #215/#262: infra-plan and infra-apply below only ever touch infra/cicd and
            # infra/registry (their matrix is hardcoded to those two dirs) — narrower than
            # infra_relevant above, which infra-checks (fmt/validate/test/lint) legitimately keeps
            # broad across every infra/** root module. Without this, a PR touching only
            # infra/foundation or infra/modules/trial_org would still assume infra_plan's AWS
            # credentials and run a pointless tofu plan against cicd/registry state.
            infra_cicd_registry_relevant:
              - 'infra/cicd/**'
              - 'infra/registry/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/infra-tofu/**'
            # Issue #216: infra-plan-platform/deploy-administration-stack-staging below only ever
            # touch infra/platform — narrower than infra_relevant, same reasoning as
            # infra_cicd_registry_relevant above (a PR touching only infra/foundation or
            # infra/modules/trial_org shouldn't assume infra_plan's AWS credentials for this).
            infra_platform_relevant:
              - 'infra/platform/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/infra-tofu/**'
            lint_relevant:
              - 'custom_addons/**'
              - 'ruff.toml'
              - 'scripts/dev.sh'
              - 'scripts/dev.ps1'
              - '.github/workflows/ci.yml'
            stack_relevant:
              - 'stack/**'
              - '.github/workflows/ci.yml'
            release_version_relevant:
              - 'scripts/release_version/**'
              - '.github/workflows/ci.yml'
            manifest_version_relevant:
              - 'custom_addons/**'
              - 'scripts/release_version/**'
              - '.github/workflows/ci.yml'
      - name: Build per-module change filters
        run: |
          {
            echo "shared:"
            echo "  - 'docker/**'"
            echo "  - 'scripts/dev.sh'"
            echo "  - 'requirements.txt'"
            echo "  - 'compose.yaml'"
            echo "  - '.github/workflows/ci.yml'"
            echo "  - '.github/actions/**'"
            for manifest in custom_addons/*/__manifest__.py; do
              module="$(basename "$(dirname "$manifest")")"
              echo "module_${module}:"
              echo "  - 'custom_addons/${module}/**'"
            done
          } > "$RUNNER_TEMP/module-filters.yml"
      - name: Detect which modules changed
        id: modules
        uses: dorny/paths-filter@v3
        with:
          filters: "${{ runner.temp }}/module-filters.yml"
      - name: Plan which owned modules need testing
        id: plan
        env:
          SHARED_CHANGED: ${{ steps.modules.outputs.shared }}
          CHANGED_FILTERS: ${{ steps.modules.outputs.changes }}
        run: |
          # A change outside a specific module's own directory (docker/, scripts/, a
          # shared file directly under custom_addons/, the Dockerfile, etc.) can affect
          # every module's test run, so fall back to testing all of them. Only when
          # every changed path falls under a single module's own directory do we narrow
          # the run to just those modules.
          if [[ "$SHARED_CHANGED" == "true" ]]; then
            modules=()
            for manifest in custom_addons/*/__manifest__.py; do
              modules+=("$(basename "$(dirname "$manifest")")")
            done
          else
            mapfile -t matched < <(jq -r '.[]' <<<"$CHANGED_FILTERS")
            modules=()
            for filter in "${matched[@]}"; do
              [[ "$filter" == module_* ]] && modules+=("${filter#module_}")
            done
          fi

          printf '%s\n' "${modules[@]:-}" | jq -R . | jq -sc 'map(select(length > 0))' | { read -r json; echo "modules=$json" >> "$GITHUB_OUTPUT"; }

  build-image:
    name: Build development image
    needs: changes
    # head.repo.full_name == repository excludes a fork's pull_request run: this workflow only
    # triggers on pull_request (no push trigger), whose OIDC token claims (sub/repository) are
    # always the base repo regardless of whether the PR's head branch lives here or in a fork
    # (see infra/cicd/oidc.tf's ecr_push_trust comment) -- ecr_push's IAM trust policy alone
    # cannot tell the two apart, so this check is the actual gate keeping a fork's PR from ever
    # reaching the ecr-login step below.
    if: needs.changes.outputs.image_relevant == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Read defaults shared with local dev (.env.example)
        id: defaults
        run: |
          echo "odoo_image=$(sed -n -E 's/^ODOO_IMAGE=(.*)$/\1/p' .env.example)" >> "$GITHUB_OUTPUT"
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: ./.github/actions/ecr-login
        id: ecr-login
        with:
          role-arn: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          registry-account-id: ${{ vars.PLATFORM_ACCOUNT_ID }}
      - name: Compute the image tag from its content inputs
        # Tag by the hash of everything that actually affects the image's contents
        # (not github.sha), so a PR that only touches custom_addons/ or scripts/
        # resolves to an already-published tag and skips the push below entirely.
        # hashFiles() only works inside a step's own expression context, not in a
        # job-level env: block, so it's computed here and read via step outputs.
        id: tag
        run: echo "image=${{ steps.ecr-login.outputs.registry }}/agentic-erp/odoo-dev:${{ hashFiles('docker/odoo-dev.Dockerfile', 'docker/*.sh', 'requirements.txt', '.env.example') }}" >> "$GITHUB_OUTPUT"
      - name: Check whether this image tag is already published
        id: existing
        env:
          DEV_IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$DEV_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.exists != 'true'
        with:
          context: .
          file: docker/odoo-dev.Dockerfile
          build-args: |
            ODOO_IMAGE=${{ steps.defaults.outputs.odoo_image }}
            HOST_UID=${{ steps.defaults.outputs.uid }}
            HOST_GID=${{ steps.defaults.outputs.gid }}
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-prod-image:
    name: Build and publish production image
    needs: changes
    # See build-image's identical guard above: excludes a fork's pull_request run, which
    # ecr_push's IAM trust policy alone cannot distinguish from this repo's own.
    if: needs.changes.outputs.prod_image_relevant == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Read defaults shared with local dev (.env.example)
        id: defaults
        run: echo "odoo_image=$(sed -n -E 's/^ODOO_IMAGE=(.*)$/\1/p' .env.example)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: ./.github/actions/ecr-login
        id: ecr-login
        with:
          role-arn: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          registry-account-id: ${{ vars.PLATFORM_ACCOUNT_ID }}
      - name: Compute the image tag from its content inputs
        # This image bakes in the whole application tree (odoo-bin, odoo/, addons/,
        # custom_addons/), not the small, rarely-changing set of build inputs build-image
        # hashes — hashFiles() walking and hashing the contents of those vendored trees
        # would be expensive. git already has a cheap content identity for a tree/blob at
        # HEAD (its object id, no file content read required beyond what git has cached),
        # so combine those instead of file contents: an unrelated change elsewhere in the
        # repo (or an edit to another job in this workflow file) still resolves to the
        # existing published tag and skips the push below, matching build-image's own
        # "skip if already published" behavior.
        id: tag
        run: |
          content_id=$(
            for path in .env.example odoo-bin odoo addons custom_addons requirements.txt \
              docker/odoo-prod.Dockerfile docker/odoo-prod.conf docker/pip-install-requirements.sh; do
              git rev-parse "HEAD:$path"
            done | sha256sum | cut -d' ' -f1
          )
          echo "image=${{ steps.ecr-login.outputs.registry }}/agentic-erp/odoo-prod:$content_id" >> "$GITHUB_OUTPUT"
      - name: Check whether this image tag is already published
        id: existing
        env:
          PROD_IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$PROD_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.exists != 'true'
        with:
          context: .
          file: docker/odoo-prod.Dockerfile
          build-args: |
            ODOO_IMAGE=${{ steps.defaults.outputs.odoo_image }}
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-stack-image:
    name: Build and publish administration-stack API image
    needs: changes
    # Same fork-exclusion guard as build-image/build-prod-image (ecr_push's IAM trust policy
    # alone can't tell a fork's pull_request run from this repo's own).
    if: needs.changes.outputs.stack_relevant == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: ./.github/actions/ecr-login
        id: ecr-login
        with:
          role-arn: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          registry-account-id: ${{ vars.PLATFORM_ACCOUNT_ID }}
      - name: Compute the image tag from its content inputs
        # Content-hash tagged, same convention as build-image/build-prod-image — this is not the
        # tag deploy-administration-stack-staging deploys under (that's the release version,
        # issue #216); it retags this same, already-pushed image afterward, so the bytes a
        # staging deploy ships are exactly what this job built and (non-blocking `test` job
        # aside) nothing rebuilds them.
        id: tag
        run: echo "image=${{ steps.ecr-login.outputs.registry }}/agentic-erp/administration-stack-api:${{ hashFiles('stack/**') }}" >> "$GITHUB_OUTPUT"
      - name: Check whether this image tag is already published
        id: existing
        env:
          STACK_IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$STACK_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.exists != 'true'
        with:
          context: stack
          file: stack/apps/api/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    name: Lint
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.lint_relevant == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.lint_relevant == 'true'
        with:
          python-version: '3.x'
      - name: Install ruff
        if: needs.changes.outputs.lint_relevant == 'true'
        run: pip install ruff==0.16.1
      - name: Run ruff
        if: needs.changes.outputs.lint_relevant == 'true'
        # No --ignore EXE002: that exclusion is Windows/MSYS-only local-dev
        # noise (see docs/adr/0028) and doesn't apply on this Linux runner.
        run: ruff check --config ruff.toml custom_addons

  docs-build-tests:
    name: Docs-build tooling tests
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_build == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.docs_build == 'true'
        with:
          python-version: '3.x'
      - name: Run docs-build unit tests
        if: needs.changes.outputs.docs_build == 'true'
        run: |
          python3 -m unittest discover -s scripts/docs_build/tests -t .

  release-version-tests:
    name: Release-version derivation tests
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.release_version_relevant == 'true'
        with:
          # This job runs the unittest suite over PR-controlled test files; a malicious test
          # must not be able to read a persisted git credential out of local config afterward.
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.release_version_relevant == 'true'
        with:
          python-version: '3.x'
      - name: Run release-version unit tests
        if: needs.changes.outputs.release_version_relevant == 'true'
        run: |
          python3 -m unittest discover -s scripts/release_version/tests -t .

  manifest-version-check:
    name: Owned addon manifest versions match the release tag
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.manifest_version_relevant == 'true'
        with:
          # A malicious PR could edit scripts/release_version/** (this check's own code), so
          # no persisted git credential should be left behind for it to read.
          persist-credentials: false
      - name: Fetch release tags
        # Shallow, refspec-scoped fetch of just the v* tag refs (and the single commit each
        # points at) — not a full-history clone (`fetch-depth: 0`), which would walk this
        # whole (huge) repo's history just to find a tag name.
        if: needs.changes.outputs.manifest_version_relevant == 'true'
        run: git fetch --no-tags --depth=1 origin 'refs/tags/v*:refs/tags/v*'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.manifest_version_relevant == 'true'
        with:
          python-version: '3.x'
      - name: Resolve the current release tag
        # The latest v* tag by version sort, not `git describe` (which needs the ancestry
        # graph between HEAD and the tag — exactly the history walk the shallow fetch above
        # avoids). This repo cuts one release tag at a time off its release branches, so
        # "latest by version" and "nearest reachable ancestor" agree in practice.
        id: tag
        if: needs.changes.outputs.manifest_version_relevant == 'true'
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n1)
          if [[ -z "$tag" ]]; then
            echo "No v* release tag found" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check owned addon manifest versions against the release tag
        if: needs.changes.outputs.manifest_version_relevant == 'true'
        run: python3 -m scripts.release_version.check "${{ steps.tag.outputs.tag }}"

  infra-checks:
    name: Infra checks
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.infra_relevant == 'true'
      - uses: opentofu/setup-opentofu@v1
        if: needs.changes.outputs.infra_relevant == 'true'
        with:
          tofu_version: 1.8.5
      - name: tofu fmt -check
        if: needs.changes.outputs.infra_relevant == 'true'
        run: tofu fmt -check -recursive infra/
      - name: tofu validate (bootstrap, foundation, cicd, registry, platform, trial_org, and its validate fixture)
        if: needs.changes.outputs.infra_relevant == 'true'
        run: |
          for dir in infra/bootstrap infra/foundation infra/cicd infra/registry infra/platform infra/modules/trial_org infra/modules/trial_org/examples/validate; do
            echo "::group::tofu validate $dir"
            (cd "$dir" && tofu init -backend=false -input=false && tofu validate)
            echo "::endgroup::"
          done
      - name: tofu test (foundation — issue #183/ADR-0033 IAM isolation, no live AWS account needed)
        if: needs.changes.outputs.infra_relevant == 'true'
        run: |
          cd infra/foundation
          tofu init -backend=false -input=false
          tofu test
      - name: tofu test (cicd — issue #212/#252 OIDC deploy/push-role branch and repository isolation, no live AWS account needed)
        if: needs.changes.outputs.infra_relevant == 'true'
        run: |
          cd infra/cicd
          tofu init -backend=false -input=false
          tofu test
      - name: tofu test (registry — issue #252 tofu-runner cross-account repository policy isolation, no live AWS account needed)
        if: needs.changes.outputs.infra_relevant == 'true'
        run: |
          cd infra/registry
          tofu init -backend=false -input=false
          tofu test
      - name: tofu test (platform — issue #216 administration-stack API no-public-ingress boundary, no live AWS account needed)
        if: needs.changes.outputs.infra_relevant == 'true'
        run: |
          cd infra/platform
          tofu init -backend=false -input=false
          tofu test
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.infra_relevant == 'true'
        with:
          python-version: '3.x'
      - name: Install ruff, interrogate, and boto3 (for the lambda_src unit tests below)
        if: needs.changes.outputs.infra_relevant == 'true'
        run: pip install ruff==0.16.1 interrogate==1.7.0 boto3
      - name: Run ruff
        if: needs.changes.outputs.infra_relevant == 'true'
        run: ruff check --config ruff.toml infra/
      - name: Run interrogate (docstring-coverage regression tripwire, not a documentation-quality proxy — 80% floor matches CodeRabbit's own default)
        if: needs.changes.outputs.infra_relevant == 'true'
        run: interrogate --fail-under 80 infra/
      - name: Run lambda_src unit tests
        if: needs.changes.outputs.infra_relevant == 'true'
        # One `unittest discover` per Lambda directory, not a single discover rooted at
        # lambda_src/ - each Lambda's handler.py imports its sibling `ec2_client` module as a flat
        # module (no `__init__.py` anywhere here, matching how lambda.tf's archive_file zips them
        # flat at the deployment package root), and a single discover walking multiple such
        # sibling directories as one implicit namespace package finds zero tests instead of
        # reporting the import error.
        run: |
          for dir in infra/foundation/lambda_src/*/; do
            if compgen -G "${dir}test_*.py" > /dev/null; then
              echo "::group::unittest discover $dir"
              python3 -m unittest discover -s "$dir" -p "test_*.py" -v
              echo "::endgroup::"
            fi
          done

  infra-plan:
    name: Infra plan (${{ matrix.dir }})
    # Issue #215: a real `tofu plan` (not an empty-state one) needs read credentials, so this
    # depends on infra-checks succeeding first (fmt/validate/test/lint) even though nothing here
    # consumes its output — a broken module shouldn't get a plan attempt against real state.
    needs: [changes, infra-checks]
    if: github.event_name == 'pull_request' && needs.changes.outputs.infra_cicd_registry_relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        dir: [infra/cicd, infra/registry]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # infra_plan (infra/cicd/oidc.tf, issue #215): read-only, shared across both branches'
          # PRs — job_workflow_ref carries no branch information to isolate a PR-time role by (see
          # oidc.tf's infra_plan comment), so this is deliberately not staging_deploy/
          # production_deploy, which stay push-only/branch-scoped for the apply job below.
          role-to-assume: ${{ vars.INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: ./.github/actions/infra-tofu
        with:
          dir: ${{ matrix.dir }}
          command: plan
          bucket: ${{ vars.TOFU_STATE_BUCKET }}
          region: ${{ vars.AWS_REGION }}
          dynamodb_table: ${{ vars.TOFU_STATE_LOCK_TABLE }}
          platform_account_id: ${{ vars.PLATFORM_ACCOUNT_ID }}
          tofu_state_bucket_arn: ${{ vars.TOFU_STATE_BUCKET_ARN }}
          tofu_state_lock_table_arn: ${{ vars.TOFU_STATE_LOCK_TABLE_ARN }}
          hosting_account_ecs_task_execution_role_arn: ${{ vars.HOSTING_ACCOUNT_ECS_TASK_EXECUTION_ROLE_ARN }}
          # Issue #271/#272: infra/cicd's own plan needs no cross-account role (it only reads its
          # own Hosting Account resources); infra/registry's plan chains infra_plan (already
          # assumed above) into platform-ci-plan to actually read its Platform Account resources.
          platform_registry_deploy_role_arn: ${{ vars.PLATFORM_REGISTRY_DEPLOY_ROLE_ARN }}
          platform_administration_stack_deploy_role_arn: ${{ vars.PLATFORM_ADMINISTRATION_STACK_DEPLOY_ROLE_ARN }}
          platform_ci_plan_role_arn: ${{ vars.PLATFORM_CI_PLAN_ROLE_ARN }}
          staging_deploy_role_arn: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
          production_deploy_role_arn: ${{ vars.PRODUCTION_DEPLOY_ROLE_ARN }}
          infra_plan_role_arn: ${{ vars.INFRA_PLAN_ROLE_ARN }}
          ecr_push_role_arn: ${{ vars.ECR_PUSH_ROLE_ARN }}
          platform_assume_role_arn: ${{ matrix.dir == 'infra/registry' && vars.PLATFORM_CI_PLAN_ROLE_ARN || '' }}

  infra-apply:
    name: Infra apply (${{ matrix.dir }})
    # Existing infra-checks (fmt/validate/test/lint) gates this apply, per #215's acceptance
    # criteria — a merge whose own infra-checks run failed must never reach `tofu apply`.
    needs: [changes, infra-checks]
    if: github.event_name == 'push' && needs.changes.outputs.infra_cicd_registry_relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        dir: [infra/cicd, infra/registry]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.5
      - name: Select the branch-scoped deploy role for this push (issue #212's roles — dev/19.0 assumes staging_deploy, main/19.0 assumes production_deploy)
        id: role
        run: |
          case "${{ github.ref_name }}" in
            dev/19.0) echo "role_arn=${{ vars.STAGING_DEPLOY_ROLE_ARN }}" >> "$GITHUB_OUTPUT" ;;
            main/19.0) echo "role_arn=${{ vars.PRODUCTION_DEPLOY_ROLE_ARN }}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "No deploy role mapped for branch '${{ github.ref_name }}' — this job's trigger (on.push.branches above) must stay in sync with this case statement." >&2
              exit 1
              ;;
          esac
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: ./.github/actions/infra-tofu
        with:
          dir: ${{ matrix.dir }}
          command: apply
          bucket: ${{ vars.TOFU_STATE_BUCKET }}
          region: ${{ vars.AWS_REGION }}
          dynamodb_table: ${{ vars.TOFU_STATE_LOCK_TABLE }}
          platform_account_id: ${{ vars.PLATFORM_ACCOUNT_ID }}
          tofu_state_bucket_arn: ${{ vars.TOFU_STATE_BUCKET_ARN }}
          tofu_state_lock_table_arn: ${{ vars.TOFU_STATE_LOCK_TABLE_ARN }}
          hosting_account_ecs_task_execution_role_arn: ${{ vars.HOSTING_ACCOUNT_ECS_TASK_EXECUTION_ROLE_ARN }}
          # Issue #271/#272: infra/cicd's own apply needs no cross-account role; infra/registry's
          # apply chains the just-assumed staging_deploy/production_deploy into
          # platform-registry-deploy (which trusts both, same as infra_management_statements
          # already shares between them) to actually manage its Platform Account ECR resources.
          platform_registry_deploy_role_arn: ${{ vars.PLATFORM_REGISTRY_DEPLOY_ROLE_ARN }}
          platform_administration_stack_deploy_role_arn: ${{ vars.PLATFORM_ADMINISTRATION_STACK_DEPLOY_ROLE_ARN }}
          platform_ci_plan_role_arn: ${{ vars.PLATFORM_CI_PLAN_ROLE_ARN }}
          staging_deploy_role_arn: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
          production_deploy_role_arn: ${{ vars.PRODUCTION_DEPLOY_ROLE_ARN }}
          infra_plan_role_arn: ${{ vars.INFRA_PLAN_ROLE_ARN }}
          ecr_push_role_arn: ${{ vars.ECR_PUSH_ROLE_ARN }}
          platform_assume_role_arn: ${{ matrix.dir == 'infra/registry' && vars.PLATFORM_REGISTRY_DEPLOY_ROLE_ARN || '' }}

  infra-plan-platform:
    name: Infra plan (infra/platform)
    # See infra-plan's identical reasoning above for depending on infra-checks first.
    needs: [changes, infra-checks]
    if: github.event_name == 'pull_request' && needs.changes.outputs.infra_platform_relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/resolve-release-tag
        # This plan's own preview of the image tag a deploy would use, not a requirement that one
        # already exists in ECR (a `tofu plan` never validates that the image tag it renders
        # actually exists).
        id: tag
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Same shared, read-only infra_plan role as infra-plan above — its trust condition
          # carries no branch information to isolate by, and this ticket's real staging-only
          # write access lives on staging_deploy instead (infra/cicd/oidc.tf's
          # administration_stack_deploy document, issue #216).
          role-to-assume: ${{ vars.INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: ./.github/actions/infra-tofu
        with:
          dir: infra/platform
          command: plan
          bucket: ${{ vars.TOFU_STATE_BUCKET }}
          region: ${{ vars.AWS_REGION }}
          dynamodb_table: ${{ vars.TOFU_STATE_LOCK_TABLE }}
          platform_account_id: ${{ vars.PLATFORM_ACCOUNT_ID }}
          tofu_state_bucket_arn: ${{ vars.TOFU_STATE_BUCKET_ARN }}
          tofu_state_lock_table_arn: ${{ vars.TOFU_STATE_LOCK_TABLE_ARN }}
          hosting_account_ecs_task_execution_role_arn: ${{ vars.HOSTING_ACCOUNT_ECS_TASK_EXECUTION_ROLE_ARN }}
          administration_stack_api_repository_url: ${{ vars.ADMINISTRATION_STACK_API_REPOSITORY_URL }}
          administration_stack_image_tag: ${{ steps.tag.outputs.tag }}
          # Issue #271/#272: infra_plan (just assumed above) chains into platform-ci-plan to
          # actually read infra/platform's Platform Account resources for a real plan diff.
          platform_assume_role_arn: ${{ vars.PLATFORM_CI_PLAN_ROLE_ARN }}

  deploy-administration-stack-staging:
    name: Deploy administration-stack API (staging)
    # Same infra-checks gate as infra-apply above — a merge whose own infra-checks failed must
    # never reach a real ECR retag or `tofu apply` (issue #216's acceptance criteria: "a failed
    # step stops the workflow rather than leaving a partial deploy").
    needs: [changes, infra-checks]
    # dev/19.0 hardcoded, matching infra-apply's own branch case statement above — this repo's
    # branch names are literal strings in ci.yml throughout (on.push.branches, infra-apply's role
    # selection), never a repository variable.
    if: github.event_name == 'push' && github.ref_name == 'dev/19.0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/resolve-release-tag
        # This is "the current release's derived version" issue #216's acceptance criteria
        # deploys under.
        id: tag
      - name: Compute the content-hash tag build-stack-image published this commit's image under
        id: content_tag
        run: echo "tag=${{ hashFiles('stack/**') }}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Retag the PR-built image with the release version
        # No rebuild: the bytes this deploys are exactly what build-stack-image (PR-time,
        # ecr_push role) already pushed under its content-hash tag — this only adds a second tag
        # to the same image manifest (staging_deploy's own narrow RetagAdministrationStackImage
        # grant, infra/cicd/oidc.tf), so the image a staging deploy ships is always something a PR
        # already tested.
        env:
          CONTENT_HASH_TAG: ${{ steps.content_tag.outputs.tag }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          PLATFORM_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
        run: |
          manifest=$(aws ecr batch-get-image \
            --registry-id "$PLATFORM_ACCOUNT_ID" \
            --repository-name agentic-erp/administration-stack-api \
            --image-ids imageTag="$CONTENT_HASH_TAG" \
            --query 'images[0].imageManifest' --output text)
          if [[ -z "$manifest" || "$manifest" == "None" ]]; then
            echo "No agentic-erp/administration-stack-api image found for content-hash tag $CONTENT_HASH_TAG — did build-stack-image run for this commit's stack/** tree?" >&2
            exit 1
          fi
          # Idempotent: a re-run for a commit whose release tag was already retagged must not fail
          # the job — neither "the tag already points at this manifest" nor a concurrent retag
          # racing this one (ImageAlreadyExistsException) is a real deploy failure.
          existing=$(aws ecr batch-get-image \
            --registry-id "$PLATFORM_ACCOUNT_ID" \
            --repository-name agentic-erp/administration-stack-api \
            --image-ids imageTag="$RELEASE_TAG" \
            --query 'images[0].imageManifest' --output text 2>/dev/null || true)
          if [[ "$existing" == "$manifest" ]]; then
            echo "Release tag $RELEASE_TAG already points at this manifest — nothing to retag."
            exit 0
          fi
          if ! aws ecr put-image \
            --registry-id "$PLATFORM_ACCOUNT_ID" \
            --repository-name agentic-erp/administration-stack-api \
            --image-tag "$RELEASE_TAG" \
            --image-manifest "$manifest" 2> put-image.err; then
            if grep -q ImageAlreadyExistsException put-image.err; then
              cat put-image.err >&2
              echo "Concurrent retag already created $RELEASE_TAG — treating as success."
            else
              cat put-image.err >&2
              exit 1
            fi
          fi
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.5
      - uses: ./.github/actions/infra-tofu
        with:
          dir: infra/platform
          command: apply
          bucket: ${{ vars.TOFU_STATE_BUCKET }}
          region: ${{ vars.AWS_REGION }}
          dynamodb_table: ${{ vars.TOFU_STATE_LOCK_TABLE }}
          platform_account_id: ${{ vars.PLATFORM_ACCOUNT_ID }}
          tofu_state_bucket_arn: ${{ vars.TOFU_STATE_BUCKET_ARN }}
          tofu_state_lock_table_arn: ${{ vars.TOFU_STATE_LOCK_TABLE_ARN }}
          hosting_account_ecs_task_execution_role_arn: ${{ vars.HOSTING_ACCOUNT_ECS_TASK_EXECUTION_ROLE_ARN }}
          administration_stack_api_repository_url: ${{ vars.ADMINISTRATION_STACK_API_REPOSITORY_URL }}
          administration_stack_image_tag: ${{ steps.tag.outputs.tag }}
          # Issue #271/#272: staging_deploy (just assumed above) chains into
          # platform-administration-stack-deploy to actually manage infra/platform's Platform
          # Account resources.
          platform_assume_role_arn: ${{ vars.PLATFORM_ADMINISTRATION_STACK_DEPLOY_ROLE_ARN }}
      - name: Record which release is now running in staging
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "## Deployed to staging"
            echo "Release \`$RELEASE_TAG\` is now running in the administration-stack API's ECS service (\`aws ecs describe-services --cluster platform --services platform-administration-stack-api --include TAGS\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  stack-checks:
    name: Stack checks
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.stack_relevant == 'true'
        with:
          fetch-depth: 1
          # This job runs `npm ci` on PR-controlled dependencies; a malicious lifecycle script
          # must not be able to read a persisted git credential out of local config afterward.
          persist-credentials: false
      - name: Fetch the base branch's tip for the OpenAPI breaking-change diff
        if: needs.changes.outputs.stack_relevant == 'true'
        # openapi:breaking-check reads the committed document at origin/<base_ref> (git show).
        # A full fetch-depth: 0 checkout would work too, but clones this repo's entire history
        # to do it - a shallow, single-commit fetch of just the base branch's tip is enough,
        # since `git show <ref>:<path>` only needs that one commit's tree.
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.stack_relevant == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stack/package-lock.json
      - name: npm ci
        if: needs.changes.outputs.stack_relevant == 'true'
        working-directory: stack
        run: npm ci
      - name: Typecheck
        if: needs.changes.outputs.stack_relevant == 'true'
        working-directory: stack
        run: npm run typecheck
      - name: Test
        if: needs.changes.outputs.stack_relevant == 'true'
        working-directory: stack
        run: npm run test
      - name: OpenAPI document is committed and matches the validators (docs/adr/0036)
        if: needs.changes.outputs.stack_relevant == 'true'
        working-directory: stack
        run: npm run openapi:check
      - name: OpenAPI breaking-change gate against the PR's base branch
        if: needs.changes.outputs.stack_relevant == 'true'
        working-directory: stack
        env:
          OPENAPI_BASE_REF: origin/${{ github.base_ref }}
        run: npm run openapi:breaking-check

  ci-required:
    name: CI required checks (required)
    needs: [lint, docs-build-tests, infra-checks, stack-checks, release-version-tests, manifest-version-check]
    # if: always() so this still runs (and can fail) even when lint,
    # docs-build-tests, infra-checks, stack-checks, release-version-tests, or
    # manifest-version-check was skipped — e.g. because the upstream `changes` job itself
    # errored. GitHub branch protection treats a skipped required check as passing, so
    # without this a `changes` failure would let a PR merge without any of them ever
    # having run.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require lint, docs-build-tests, infra-checks, stack-checks, release-version-tests, and manifest-version-check to have succeeded
        if: needs.lint.result != 'success' || needs.docs-build-tests.result != 'success' || needs.infra-checks.result != 'success' || needs.stack-checks.result != 'success' || needs.release-version-tests.result != 'success' || needs.manifest-version-check.result != 'success'
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "docs-build-tests: ${{ needs.docs-build-tests.result }}"
          echo "infra-checks: ${{ needs.infra-checks.result }}"
          echo "stack-checks: ${{ needs.stack-checks.result }}"
          echo "release-version-tests: ${{ needs.release-version-tests.result }}"
          echo "manifest-version-check: ${{ needs.manifest-version-check.result }}"
          exit 1

  test:
    name: Test (${{ matrix.module }})
    needs: [changes, build-image]
    # See build-image's identical guard: excludes a fork's pull_request run, which ecr_push's
    # IAM trust policy alone cannot distinguish from this repo's own (this job assumes the same
    # role, to pull back the image build-image just pushed).
    if: needs.changes.outputs.image_relevant == 'true' && needs.changes.outputs.test_modules != '[]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Non-blocking by design: see docs/agents/sdlc.md#continuous-integration.
    # Do not add this job to the branch's required status checks.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.test_modules) }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> .env
          echo "HOST_GID=$(id -g)" >> .env
          echo "ODOO_DEV_IMAGE=${{ needs.build-image.outputs.image }}" >> .env
      - uses: ./.github/actions/ecr-login
        with:
          role-arn: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          registry-account-id: ${{ vars.PLATFORM_ACCOUNT_ID }}
      - name: Pull cached development image
        run: docker compose pull odoo
      - name: Run tests for ${{ matrix.module }}
        run: bash scripts/dev.sh test "${{ matrix.module }}"
