name: CI

on:
  pull_request:
    branches: [dev/19.0, main/19.0]

jobs:
  changes:
    name: Detect lint/test-relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - name: Check for changes under custom_addons/, docker/, scripts/, etc.
        id: check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'custom_addons/**'
              - 'docker/**'
              - 'scripts/**'
              - 'requirements.txt'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint (required)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.relevant == 'true'
      - name: Configure environment
        if: needs.changes.outputs.relevant == 'true'
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> .env
          echo "HOST_GID=$(id -g)" >> .env
      - name: Build development image
        if: needs.changes.outputs.relevant == 'true'
        run: bash scripts/dev.sh build
      - name: Run ruff
        if: needs.changes.outputs.relevant == 'true'
        run: bash scripts/dev.sh lint custom_addons

  test:
    name: Test (informational)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # Non-blocking by design: see docs/agents/sdlc.md#continuous-integration.
    # Do not add this job to the branch's required status checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> .env
          echo "HOST_GID=$(id -g)" >> .env
      - name: Build development image
        run: bash scripts/dev.sh build
      - name: Run tests for every owned module
        run: |
          set -euo pipefail
          for manifest in custom_addons/*/__manifest__.py; do
            module="$(basename "$(dirname "$manifest")")"
            echo "::group::Testing $module"
            bash scripts/dev.sh test "$module"
            echo "::endgroup::"
          done
